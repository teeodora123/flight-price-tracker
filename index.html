<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
  <title>Flight Price Tracker</title>
</head>
<body>
  <div class="container">
    <h1>Flight Price Tracker</h1>

    <button id="checkButton">Check Price</button>

    <p id="currentPrice">Current price: </p>
    <p id="lowestPrice">Lowest price seen: </p>
    <p id="alertMessage"></p>

    <ul id="historyList"></ul>
    <canvas id="priceChart"></canvas>
  </div>
  <div class="route-controls">
    <input type="text" id="originInput" placeholder="Origin (e.g. CLJ)">
    <input type="text" id="destinationInput" placeholder="Destination (e.g. LTN)">
    <button id="addRouteButton">Add Route</button>
  </div>

  <select id="routeSelector"></select>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="script.js"></script>
</body>
</html>
